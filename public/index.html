<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeTool · 免费在线工具箱</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 class="logo">FreeTool</h1>
      <p class="tagline">免费在线工具箱 · 图片处理，本地完成，不上传服务器</p>
    </div>
  </header>

  <main class="container">
    <section class="tool-card">
      <div class="tool-head">
        <h2>图片压缩</h2>
        <span class="badge">纯浏览器运行</span>
      </div>
      <p class="tool-desc">选择图片后，压缩在您的设备本地完成，图片不会上传到任何服务器。</p>

      <div id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="dz-text">
          <strong>点击选择</strong> 或拖拽图片到此处
          <small>支持 PNG / JPEG / WebP / GIF，单张最大 20MB</small>
        </div>
      </div>

      <div class="options" id="options" hidden>
        <label class="opt">
          输出格式
          <select id="format">
            <option value="keep">保持原格式</option>
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </label>
        <label class="opt">
          质量 <span id="qualityVal">80</span>
          <input type="range" id="quality" min="10" max="100" value="80" />
        </label>
        <label class="opt">
          最大宽度（0 = 不限制）
          <input type="number" id="maxWidth" min="0" step="100" value="0" />
        </label>
        <button id="compressBtn" class="btn">开始压缩</button>
      </div>

      <div class="result" id="result" hidden>
        <div class="compare">
          <div class="col">
            <span class="label">原图</span>
            <span id="origSize" class="size">—</span>
          </div>
          <div class="col">
            <span class="label">压缩后</span>
            <span id="newSize" class="size">—</span>
          </div>
        </div>
        <p id="saved" class="saved"></p>
        <a id="downloadLink" class="btn btn-download" download>下载压缩后的图片</a>
        <button id="resetBtn" class="btn btn-ghost">再压一张</button>
      </div>

      <p id="status" class="status"></p>
    </section>

    <p class="coming">更多工具（去背景、放大、格式转换等）即将上线。</p>
  </main>

  <footer class="foot">
    <span>Powered by Cloudflare Workers + GitHub</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
